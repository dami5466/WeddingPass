<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingPass | Guest Management</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f8f5ef;
            font-family: Arial, sans-serif;
            color: #29251f;
        }

        header {
            background: #201b17;
            color: white;
            padding: 22px 7%;
        }

        header h2 {
            color: #d6b46a;
            margin: 0;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .back {
            color: #a77d31;
            text-decoration: none;
        }

        h1 { margin-top: 25px; }

        .panel {
            background: white;
            padding: 28px;
            border-radius: 14px;
            margin-top: 25px;
            box-shadow: 0 5px 25px #0000000b;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            background: #b18a45;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .guest {
            border-bottom: 1px solid #eee;
            padding: 18px 0;
        }

        .guest h3 {
            color: #a77d31;
            margin-bottom: 7px;
        }

        .guest p {
            color: #777;
            margin: 5px 0;
        }

        .empty, #message {
            color: #777;
            margin-top: 15px;
        }

        .error { color: #c0392b !important; }
        .success { color: #218838 !important; }

        @media(min-width:700px) {
            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0 20px;
            }
        }
    </style>
<link rel="stylesheet" href="/css/weddingpass-background.css">
</head>

<body>
<div class="weddingpass-background">
    <video id="weddingpassVideoA" muted playsinline preload="auto"></video>
    <video id="weddingpassVideoB" muted playsinline preload="auto"></video>
</div>
<div class="weddingpass-overlay"></div>
<header>
    <h2>WeddingPass</h2>
</header>

<main>
    <a class="back" href="/dashboard">← Back to Dashboard</a>

    <h1>Guest Management</h1>
    <p>Manage invitations and organize your wedding guests.</p>

    <section class="panel">
        <h2>Add New Guest</h2>

        <form id="guestForm">

            <label for="weddingId">Select Wedding</label>
            <select id="weddingId" required>
                <option value="">Loading your weddings...</option>
            </select>

            <div class="form-grid">
                <div>
                    <label for="guestName">Guest Full Name</label>
                    <input type="text" id="guestName"
                        placeholder="Enter guest name" required maxlength="100">
                </div>

                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                        placeholder="Enter phone number" maxlength="30">
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter email address" maxlength="150">
                </div>

                <div>
                    <label for="category">Guest Category</label>
                    <select id="category" required>
                        <option value="General">General</option>
                        <option value="VIP">VIP</option>
                        <option value="Family">Family</option>
                        <option value="Friends">Friends</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="addGuestButton">
                Add Guest
            </button>

            <p id="message"></p>
        </form>
    </section>

    <section class="panel">
        <h2>Wedding Guest List</h2>
        <div id="guestList">
            <p class="empty">Select a wedding to view its guests.</p>
        </div>
    </section>
</main>

<script src="/js/guest-management.js"></script>
<script src="/js/weddingpass-background.js"></script>
</body>
</html>
