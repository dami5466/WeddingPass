<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | WeddingPass</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">

<div class="auth-container">
    <a href="/" class="logo">Wedding<span>Pass</span></a>

    <div class="auth-card">
        <p class="eyebrow">YOUR BEAUTIFUL JOURNEY STARTS HERE</p>
        <h1>Create Your Account</h1>
        <p class="auth-description">Join WeddingPass and start planning your perfect wedding experience.</p>

        <div id="message" class="message"></div>

        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email address" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password" minlength="8" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

            <button type="submit" id="registerButton">Create My Account</button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="/login">Log in</a>
        </p>
    </div>

    <p class="auth-footer">© 2026 WeddingPass. Making beautiful memories.</p>
</div>

<script src="/js/register.js"></script>
</body>
</html>
